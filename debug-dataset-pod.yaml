apiVersion: v1
kind: Pod
metadata:
  name: dataset-debug-pod
  namespace: budeval
spec:
  containers:
  - name: debug
    image: busybox
    command: ['sh', '-c', 'ls -la /opencompass/data/data | grep -E "(gsm|GSM)" || echo "No GSM datasets found"; sleep 3600']
    volumeMounts:
    - name: eval-datasets
      mountPath: /opencompass/data
  volumes:
  - name: eval-datasets
    persistentVolumeClaim:
      claimName: eval-datasets-pvc
  restartPolicy: Never