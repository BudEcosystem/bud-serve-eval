apiVersion: v1
kind: Pod
metadata:
  name: dataset-checker
  namespace: budeval
spec:
  containers:
  - name: checker
    image: busybox
    command: 
    - sh
    - -c
    - |
      echo "=== Dataset Status Check ==="
      echo
      if [ -f /data/dataset_initialized ]; then
        echo "✅ Dataset is INITIALIZED"
        echo
        echo "Initialization info:"
        cat /data/dataset_initialized
        echo
        echo "Dataset structure:"
        ls -la /data/ | head -10
        echo
        echo "Data directory contents:"
        if [ -d /data/data ]; then
          ls /data/data/ | head -10
          echo "..."
        fi
        echo
        echo "Total size:"
        du -sh /data/
      else
        echo "❌ Dataset NOT initialized"
        echo
        echo "Volume contents:"
        ls -la /data/ || echo "Volume is empty"
      fi
      sleep 10
    volumeMounts:
    - name: datasets
      mountPath: /data
  restartPolicy: Never
  volumes:
  - name: datasets
    persistentVolumeClaim:
      claimName: eval-datasets-pvc