apiVersion: batch/v1
kind: Job
metadata:
  name: opencompass-debug
  namespace: budeval
spec:
  ttlSecondsAfterFinished: 3600  # Keep for 1 hour
  template:
    spec:
      containers:
        - name: debug
          image: ghcr.io/rahulvramesh/opencompass:latest
          command: ["bash"]
          args: ["-c", "sleep 3600"]  # Sleep for 1 hour
          env:
            - name: OPENCOMPASS_CONFIG_PATH
              value: '/workspace/configs'
            - name: HF_HOME
              value: '/workspace/cache'
            - name: TRANSFORMERS_CACHE
              value: '/workspace/cache'
            - name: TORCH_HOME
              value: '/workspace/cache'
          volumeMounts:
            - name: eval-datasets
              mountPath: /workspace/data
              subPath: data
              readOnly: true
            - name: output-volume
              mountPath: /workspace/outputs
            - name: opencompass-config
              mountPath: /workspace/configs
              readOnly: true
            - name: cache-volume
              mountPath: /workspace/cache
          workingDir: /workspace
      volumes:
        - name: eval-datasets
          persistentVolumeClaim:
            claimName: eval-datasets-pvc
        - name: output-volume
          emptyDir: {}
        - name: opencompass-config
          configMap:
            name: opencompass-config-test-llama-199f2917  # Use existing config
            items:
              - key: "bud-model.py"
                path: "bud-model.py"
              - key: "bud-datasets.py"
                path: "bud-datasets.py"
              - key: "eval_config.py"
                path: "eval_config.py"
              - key: "metadata.json"
                path: "metadata.json"
        - name: cache-volume
          emptyDir: {}
      restartPolicy: Never
  backoffLimit: 1